name: Nothing site

# Publishes nothing/ to Cloudflare Pages whenever it changes on main, or when
# started by hand from the Actions tab. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare dashboard > My Profile > API Tokens,
#                           template "Edit Cloudflare Workers" or a custom
#                           token with Account > Cloudflare Pages > Edit)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard > Workers & Pages, right
#                           sidebar)
# The Pages project "subscribe-to-nothing" is created on the first run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["nothing/**", ".github/workflows/nothing.yml"]

permissions:
  contents: read
  deployments: write

concurrency:
  group: nothing-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q '^│ *subscribe-to-nothing ' \
            || npx --yes wrangler@4 pages project create subscribe-to-nothing --production-branch main
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nothing
          command: pages deploy . --project-name=subscribe-to-nothing --branch=main
